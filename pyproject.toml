[project]
name = "mva-variant-prioritization"
version = "0.1.0"
description = "MVA Variant Prioritization — RDRK Hackathon 2026 Track 1 baseline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pysam>=0.22",
    "cyvcf2>=0.30",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "python-docx>=1.1",
    "tqdm>=4.65",
]

[project.scripts]
prioritize = "src.prioritization.prioritize:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
